name: Code build

on:
#    push: 
#        branches : main
    workflow_dispatch
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code 
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'
            
            - name: Run Checkstyle
              run: mvn -B checkstyle:check

            - name: Run Dependency scan
              run: mvn org.owasp:dependency-check-maven:check
              
